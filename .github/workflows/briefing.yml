name: Build Daily Briefing

on:
  schedule:
    # Disjoint slots so no trigger ever fires twice at the same minute (#58):
    - cron: '0 */2 * * *'        # FULL rebuild: even hours, :00
    - cron: '30 */2 * * *'       # breaking_only: even hours, :30
    - cron: '0,30 1-23/2 * * *'  # breaking_only: odd hours, :00 and :30
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (full, breaking_only, category, deploy_only)'
        required: false
        default: 'full'
      category:
        description: 'Category to refresh (australia, archaeology, football)'
        required: false
        default: ''

# One run at a time. Later triggers queue (never cancel a running full build).
concurrency:
  group: briefing-build
  cancel-in-progress: false

permissions:
  contents: write  # commit memory.json / health.json / cost_log.json back to main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26  # v3.7.0

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v4.9.1
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news fetch script
        id: run
        # Exit 1 means "alert" (see safety.decide_alert). Let the commit-back and deploy steps
        # run first, then the last step fails the job so GitHub sends its failure notification.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Mode comes from the schedule string: the full cron ('0 */2 * * *') => full,
          # any other cron => breaking_only. Manual dispatch uses the 'mode' input
          # (a blank or missing mode means 'full'), exactly as before. KEEP IN SYNC with the cron lines above.
          RUN_MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 */2 * * *' && 'full' || 'breaking_only') || github.event.inputs.mode || 'full' }}
          RUN_CATEGORY: ${{ github.event.inputs.category || '' }}
        run: python fetch_news.py

      - name: Commit memory file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add memory.json health.json cost_log.json COST_SUMMARY.md || true
          git diff --staged --quiet || git commit -m "Update story memory"
          git pull --rebase || true
          git push || true

      - name: Deploy to Cloudflare Pages
        if: hashFiles('dist/.deploy_needed') != ''
        run: |
          npm install -g wrangler
          wrangler pages deploy dist --project-name=daily-briefing --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Fail the run if the briefing run alerted
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::Briefing run failed (data not good, or first stale crossing). See health.json."
          exit 1
